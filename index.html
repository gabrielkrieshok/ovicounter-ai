<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- Page zoom is disabled deliberately. The strip screens implement their own
         pinch-zoom over a canvas in image space; browser zoom on top of that
         fights the gesture and breaks hit-testing against the marks. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#14100c" />
    <link rel="icon" href="/icon.png" />
    <link rel="apple-touch-icon" href="/icon.png" />
    <title>Ovicounter AI</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
